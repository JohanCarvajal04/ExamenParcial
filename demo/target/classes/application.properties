server.port=8080

spring.application.name=demo

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercado_quevedo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:P123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG


spring.cache.type=redis

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1wYXJhLWVsLW1lcmNhZG8tbXVuaWNpcGFsLWRlLXF1ZXZlZG8tMjAyNi1jYW1iaWFyLWVuLXByb2R1Y2Npb24=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}
app.cache.productos-ttl-seconds=300

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.quevedo.mercado.inventario=DEBUG
logging.level.org.springframework.security=INFO